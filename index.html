<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Carmen · Derecho Penal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Plataforma de estudio guiado del Capítulo 2 (Breve historia) de Lecciones de derecho penal, Díaz-Aranda">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Serif+Display&display=swap">
<style>
/* Concepto: «Expediente rosa» — cada estación es una hoja del expediente de estudio de Carmen; citas del libro como fojas engrapadas, rosa como color de marca. */
:root {
  --bg: #fbf1f5;
  --surface: #ffffff;
  --surface-2: #f8e6ee;
  --ink: #2b1621;
  --muted: #7b5b69;
  --line: #efd3df;
  --accent: #c2185b;
  --accent-2: #e04a86;
  --accent-soft: #fde1ec;
  --on-accent: #ffffff;
  --mark: #ffc4da;
  --mark-ink: #2b1621;
  --ok: #18794e;
  --ok-soft: #ddf3e8;
  --bad: #b3261e;
  --bad-soft: #fde4e1;
  --warn: #8a5300;
  --warn-soft: #fff0d9;
  --paper-rule: #f3c6d7;
  --shadow: 0 1px 2px rgba(120, 20, 60, .06), 0 8px 22px rgba(120, 20, 60, .07);
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --r: 16px;
  --cw: 24px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #170c12; --surface: #241520; --surface-2: #301c29; --ink: #f9e9f0; --muted: #c4a3b2; --line: #44293a;
    --accent: #ff6fa3; --accent-2: #ff9cc0; --accent-soft: #3d1a2c; --on-accent: #2a0716;
    --mark: #6e2547; --mark-ink: #fff0f6; --ok: #62d39c; --ok-soft: #153325; --bad: #ff8b80; --bad-soft: #3e1c1a;
    --warn: #ffc56b; --warn-soft: #3a2a12; --paper-rule: #5c2a42; --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #170c12; --surface: #241520; --surface-2: #301c29; --ink: #f9e9f0; --muted: #c4a3b2; --line: #44293a;
  --accent: #ff6fa3; --accent-2: #ff9cc0; --accent-soft: #3d1a2c; --on-accent: #2a0716;
  --mark: #6e2547; --mark-ink: #fff0f6; --ok: #62d39c; --ok-soft: #153325; --bad: #ff8b80; --bad-soft: #3e1c1a;
  --warn: #ffc56b; --warn-soft: #3a2a12; --paper-rule: #5c2a42; --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.6; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
mark { background: linear-gradient(transparent 40%, var(--mark) 40%, var(--mark) 92%, transparent 92%); color: var(--mark-ink); padding: 0 2px; }
a { color: var(--accent); }
.app { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px calc(100px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.app > * { min-width: 0; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; }
h2 { font-size: 1.4rem; }
h3 { font-size: 1.1rem; font-family: var(--font-body); font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.center { text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.eyebrow { font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.stack { display: grid; gap: 12px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
.stack.tight { gap: 3px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; min-width: 0; display: grid; gap: 10px; }
.card.quiet { box-shadow: none; background: transparent; border: 1.5px dashed var(--paper-rule); }
.tnum { font-variant-numeric: tabular-nums; }
.tight-list { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

.btn { border: 0; border-radius: 999px; padding: 11px 20px; font-weight: 700; background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; text-decoration: none; max-width: 100%; text-align: center; line-height: 1.25; }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn.line { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { padding: 8px 14px; min-height: 40px; font-size: .9rem; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.icon-btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .86rem; font-weight: 700; min-height: 38px; display: inline-flex; gap: 6px; align-items: center; color: var(--ink); text-align: left; }
.icon-btn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip { display: inline-flex; align-items: center; font-size: .72rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.done { background: var(--ok-soft); color: var(--ok); }
.bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
.bar.ok > i { background: var(--ok); }

/* Inicio */
.hero { background: var(--accent); color: var(--on-accent); border-radius: 22px; padding: 22px 20px; display: grid; gap: 10px; position: relative; overflow: hidden; }
.hero::after { content: "§"; position: absolute; right: -8px; top: -38px; font-family: var(--font-display); font-size: 11rem; line-height: 1; opacity: .13; pointer-events: none; }
.hero h1 { font-size: 2.3rem; color: var(--on-accent); }
.hero .sub { opacity: .92; max-width: 46ch; }
.eyebrow.on-acc { color: var(--on-accent); opacity: .8; }
.hero-meter { display: grid; gap: 6px; margin-top: 4px; font-weight: 700; font-size: .92rem; }
.hero .bar { background: rgba(255,255,255,.28); }
.hero .bar > i { background: var(--on-accent); }
.next-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; }
.big-ic { width: 52px; height: 52px; border-radius: 14px; background: var(--accent-soft); display: grid; place-items: center; font-size: 1.6rem; }
.due { border: 2px solid var(--accent); }
.mission-l { display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: 12px; background: var(--surface-2); border: 0; width: 100%; text-align: left; }
.mission-l .t { flex: 1; min-width: 0; font-weight: 700; }
.method-l { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.method-l li::marker { color: var(--accent); font-weight: 800; }
.motiv { font-family: var(--font-display); font-size: 1.3rem; line-height: 1.3; color: var(--accent); }

/* Aprender */
.route { display: grid; gap: 8px; }
.lrow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); text-align: left; width: 100%; }
.lrow .n { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--paper-rule); display: grid; place-items: center; font-weight: 800; color: var(--accent); font-family: var(--font-display); font-size: 1.05rem; }
.lrow.done .n { background: var(--ok); border-color: var(--ok); color: var(--on-accent); font-family: var(--font-body); }
.lrow .tt { font-weight: 700; line-height: 1.3; }
.lrow .meta { font-size: .8rem; color: var(--muted); line-height: 1.35; }
.lrow .ic { font-size: 1.3rem; }
.back { border: 0; background: none; color: var(--accent); font-weight: 800; padding: 6px 0; justify-self: start; }
.lesson-top { display: grid; gap: 8px; }
.goal { font-size: .95rem; color: var(--muted); }
.steps-dots { display: flex; gap: 4px; }
.steps-dots i { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); }
.steps-dots i.on { background: var(--accent); }
.steps-dots i.cur { background: var(--accent-2); }
.sheet { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px 18px 20px 30px; position: relative; display: grid; gap: 12px; min-width: 0; }
.sheet::before { content: ""; position: absolute; left: 14px; top: 16px; bottom: 16px; width: 2px; background: var(--paper-rule); border-radius: 2px; }
.sheet h2 { color: var(--accent); }
.sheet .body { font-size: 1.07rem; line-height: 1.7; }
.nav-btns { display: flex; gap: 10px; }
.nav-btns .btn { flex: 1; }
.callout { border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; }
.callout.trap { background: var(--bad-soft); }
.callout.trap h3 { color: var(--bad); }
.callout.trick { background: var(--accent-soft); }
.callout.trick h3 { color: var(--accent); }
.callout ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.ta { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--bg); resize: vertical; min-height: 140px; line-height: 1.55; }
.model { background: var(--ok-soft); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; margin-top: 2px; }

/* Visuales */
.vis { min-width: 0; }
.line-wrap { overflow-x: auto; padding-bottom: 6px; }
.line { display: flex; min-width: max-content; }
.line-item { width: 138px; display: grid; gap: 4px; justify-items: center; align-content: start; text-align: center; position: relative; padding: 0 6px; }
.line-item::before { content: ""; position: absolute; top: calc(2.6em + 9px); left: 0; right: 0; height: 3px; background: var(--paper-rule); }
.line-age { font-size: .78rem; font-weight: 800; color: var(--accent); min-height: 2.6em; display: grid; align-items: end; line-height: 1.2; }
.line-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--accent); z-index: 1; }
.line-t { font-weight: 700; font-size: .88rem; line-height: 1.2; }
.line-s { font-size: .76rem; color: var(--muted); line-height: 1.3; }
.flow { display: grid; gap: 4px; }
.flow-step { display: flex; gap: 10px; align-items: flex-start; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.flow-step b { display: block; line-height: 1.25; }
.flow-step small { display: block; line-height: 1.4; margin-top: 2px; color: var(--muted); font-size: .88rem; }
.flow-n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 800; font-size: .8rem; }
.flow-arrow { text-align: center; color: var(--muted); line-height: 1; font-size: .9rem; }
.tbl-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--line); }
.tbl { border-collapse: collapse; width: 100%; font-size: .92rem; min-width: 420px; }
.tbl th { background: var(--accent-soft); color: var(--accent); text-align: left; padding: 8px 10px; font-size: .76rem; letter-spacing: .05em; text-transform: uppercase; }
.tbl td { padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: top; line-height: 1.4; }
.tree { display: grid; gap: 10px; justify-items: center; }
.tree-root { background: var(--accent); color: var(--on-accent); padding: 8px 18px; border-radius: 12px; font-family: var(--font-display); font-size: 1.1rem; }
.tree-kids { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; width: 100%; }
.tree-kid { border: 2px solid var(--accent); border-radius: 12px; padding: 10px; display: grid; gap: 4px; }
.tree-kid small { color: var(--muted); line-height: 1.35; }
.vs { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 8px; }
.vs-col { background: var(--surface-2); border-radius: 12px; padding: 12px; min-width: 0; }
.vs-h { font-weight: 800; font-size: .82rem; letter-spacing: .03em; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; }
.vs-col ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: .93rem; line-height: 1.4; }
.vs-mid { align-self: center; font-family: var(--font-display); color: var(--muted); }
@media (max-width: 480px) { .vs { grid-template-columns: minmax(0,1fr); } .vs-mid { justify-self: center; } }
.pairs { display: grid; gap: 6px; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 12px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: .93rem; line-height: 1.4; }
@media (max-width: 480px) { .pair { grid-template-columns: minmax(0,1fr); gap: 2px; } }
.bookq, .nowbox { border-radius: 4px 14px 14px 4px; border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 12px 14px; display: grid; gap: 6px; }
.nowbox { border-left-color: var(--warn); background: var(--warn-soft); }
.bookq-h { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.nowbox .bookq-h { color: var(--warn); }
.bookq-b { font-size: .98rem; line-height: 1.55; }

/* Preguntas */
.q { gap: 12px; }
.q-text { font-size: 1.07rem; font-weight: 700; line-height: 1.5; }
.qn { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: .8rem; margin-right: 8px; vertical-align: 2px; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 12px; min-height: 50px; line-height: 1.4; }
.opt .ov { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--paper-rule); display: grid; place-items: center; font-weight: 800; font-size: .82rem; color: var(--muted); }
.opt:not([disabled]):hover { border-color: var(--accent); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.ok .ov { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.no { border-color: var(--bad); background: var(--bad-soft); }
.opt.no .ov { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt[disabled] { cursor: default; }
.fb { border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.fb.ok { background: var(--ok-soft); }
.fb.no { background: var(--bad-soft); }
.fb b.h { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; }
.fb.ok b.h { color: var(--ok); }
.fb.no b.h { color: var(--bad); }
.fb .pg { font-size: .8rem; font-weight: 700; color: var(--muted); }
.grade { justify-items: center; text-align: center; padding: 22px; }
.grade > b { font-family: var(--font-display); font-weight: 400; font-size: 4rem; line-height: 1; color: var(--accent); }
.review-item { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; font-size: .95rem; overflow-wrap: anywhere; }
.review-item .ok { color: var(--ok); font-weight: 700; }
.search { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 14px; background: var(--surface); min-height: 46px; }

/* Practicar */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
.tile { border: 0; text-align: left; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: grid; gap: 4px; align-content: start; min-height: 112px; }
.tile .ti { font-size: 1.5rem; }
.tile b { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; }
.tile span:last-child { font-size: .84rem; color: var(--muted); line-height: 1.35; }
.tf-card { text-align: center; font-size: 1.2rem; font-weight: 700; padding: 30px 18px; line-height: 1.45; }
.tf-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.order-list { display: grid; gap: 8px; }
.order-item { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; line-height: 1.35; }
.order-item .on { font-weight: 800; color: var(--accent); text-align: center; }
.order-item .mv { display: flex; gap: 4px; }
.order-item .mv button { width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface-2); font-weight: 800; }
.order-item .mv button[disabled] { opacity: .3; }
.order-item.good { border-color: var(--ok); background: var(--ok-soft); }
.order-item.badp { border-color: var(--bad); background: var(--bad-soft); }
.match-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; }
.match-grid .stack { gap: 8px; }
.match-grid button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px; min-height: 56px; font-size: .92rem; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.match-grid button.sel { border-color: var(--accent); background: var(--accent-soft); }
.match-grid button.done { border-color: var(--ok); background: var(--ok-soft); opacity: .7; }
.match-grid button.err { border-color: var(--bad); background: var(--bad-soft); }
.flip { perspective: 1000px; border: 0; background: none; padding: 0; width: 100%; }
.flip-in { position: relative; min-height: 240px; transition: transform .5s; transform-style: preserve-3d; }
.flip.on .flip-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 20px; padding: 24px; display: grid; place-items: center; text-align: center; font-size: 1.25rem; font-weight: 700; line-height: 1.4; box-shadow: var(--shadow); }
.face.front { background: var(--surface); border: 2px solid var(--paper-rule); }
.face.back { background: var(--accent); color: var(--on-accent); transform: rotateY(180deg); font-size: 1.05rem; font-weight: 600; }
.face small { display: block; font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.face small.hint-s { margin: 12px 0 0; }

/* Crucigrama */
.cw-wrap { overflow-x: auto; padding: 4px 0 8px; }
.cw { display: grid; gap: 2px; width: max-content; margin: 0 auto; }
.cw-x { width: var(--cw); height: var(--cw); }
.cw-c { position: relative; width: var(--cw); height: var(--cw); background: var(--surface); border: 1.5px solid var(--paper-rule); border-radius: 4px; display: block; }
.cw-c i { position: absolute; top: 0; left: 2px; font-size: 8px; font-style: normal; font-weight: 800; color: var(--muted); line-height: 1; pointer-events: none; }
.cw-c input { width: 100%; height: 100%; border: 0; background: transparent; text-align: center; font-weight: 800; font-size: .82rem; padding: 4px 0 0; text-transform: uppercase; color: var(--ink); caret-color: var(--accent); }
.cw-c input:focus { outline: none; }
.cw-c:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); z-index: 1; }
.cw-c.hl { background: var(--accent-soft); }
.cw-c.good { background: var(--ok-soft); border-color: var(--ok); }
.cw-c.bad { background: var(--bad-soft); border-color: var(--bad); }
.cw-now { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; padding: 12px 14px; font-size: .95rem; }
.clues { display: grid; gap: 6px; }
.clue { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 8px; text-align: left; border: 0; background: var(--surface-2); border-radius: 10px; padding: 8px 10px; line-height: 1.35; font-size: .93rem; }
.clue b { color: var(--accent); }

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  const pad = n => String(n).padStart(2, '0');
  const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => dstr(new Date());
  const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return dstr(new Date(y, m - 1, d + n)); };
  const LET = ['A', 'B', 'C', 'D'];
  const INTERVALS = [1, 3, 7];
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

  function mark() { S.days[today()] = true; save(); }
  function record(t, ok) { const m = S.mastery[t] || { c: 0, n: 0 }; m.n++; if (ok) m.c++; S.mastery[t] = m; S.answered++; if (ok) S.correct++; mark(); }
  function mastery(t) { const m = S.mastery[t]; return m && m.n ? m.c / m.n : null; }
  function toast(msg) {
    const old = $('.toast'); if (old) old.remove();
    const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = msg; document.body.appendChild(d);
    setTimeout(() => d.remove(), 2600);
  }
  function streak() { let n = 0; let d = today(); if (!S.days[d]) d = addDays(d, -1); while (S.days[d]) { n++; d = addDays(d, -1); } return n; }
  function dueReviews() {
    const t = today(); const out = [];
    Object.keys(S.done).forEach(id => { const k = S.reviews[id] || 0; if (k >= INTERVALS.length) return; if (addDays(S.done[id], INTERVALS[k]) <= t) out.push(id); });
    return out;
  }
  function nextLesson() { return LESSONS.find(l => !S.done[l.id]) || null; }
  function copyText(text) {
    const done = () => toast('Enlace copiado. Pégalo en el navegador o en YouTube.');
    try { navigator.clipboard.writeText(text).then(done, () => toast('Mantén presionado el texto para copiarlo.')); } catch (e) { toast('Mantén presionado el texto para copiarlo.'); }
  }

  /* Voz */
  const synth = window.speechSynthesis || null; let speaking = null;
  function clean(h) { return String(h).replace(/<br\s*\/?>/gi, '. ').replace(/<\/(li|tr|div|p)>/gi, '. ').replace(/<\/(td|th)>/gi, ', ').replace(/<[^>]+>/g, ' ').replace(/&amp;/g, 'y').replace(/\bvs\.?/gi, 'contra').replace(/[«»"→↓·]/g, ' ').replace(/\p{Extended_Pictographic}/gu, '').replace(/\s+/g, ' ').trim(); }
  function speak(id, text) {
    if (!synth) { toast('Este navegador no puede leer en voz alta.'); return; }
    synth.cancel(); if (speaking === id) { speaking = null; refreshSpeak(); return; }
    const u = new SpeechSynthesisUtterance(clean(text)); const vs = synth.getVoices();
    const v = ['es-MX', 'es-US', 'es-419', 'es-ES', 'es'].map(p => vs.find(x => x.lang && x.lang.replace('_', '-').toLowerCase().startsWith(p.toLowerCase()))).find(Boolean);
    if (v) u.voice = v; u.lang = v ? v.lang : 'es-MX'; u.rate = S.rate;
    u.onend = u.onerror = () => { if (speaking === id) { speaking = null; refreshSpeak(); } };
    speaking = id; refreshSpeak(); synth.speak(u);
  }
  function stopSpeak() { if (synth) synth.cancel(); speaking = null; }
  function refreshSpeak() { document.querySelectorAll('[data-speak]').forEach(b => { const on = b.dataset.speak === speaking; b.classList.toggle('on', on); b.querySelector('.lbl').textContent = on ? 'Detener' : 'Escuchar'; }); }
  const SPK = {};
  function speakBtn(id, text) { SPK[id] = text; return `<button class="icon-btn" data-a="speak" data-speak="${id}"><span aria-hidden="true">🔊</span> <span class="lbl">Escuchar</span></button>`; }

  const UI = { view: 'home', lesson: null, step: 0, phase: 'intro', checks: {}, caseOpen: {}, showModel: false, quiz: null, tf: null, order: null, match: null, flash: null, flashT: 'all', cwSel: null, cwChecked: false, exam: null, gq: '', gt: 'all', gquiz: null, riddle: null, tlSel: 0, reveal: {}, hideAll: true, readOpen: {} };

  /* ═════ NAVEGACIÓN ═════ */
  const ICONS = {
    home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    learn: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 7h6"/>',
    practice: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7M17.5 14v7"/>',
    exam: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',

    ['practice', 'Practicar', 'Juegos para que no se te olvide: quiz, tarjetas, verdadero o falso, ordenar, relacionar, adivina quién soy y crucigrama.', 'Después de terminar una estación, 5 a 10 minutos.'],
    ['exam', 'Examen', 'Exámenes de todo el capítulo con calificación del 0 al 10, como en la universidad.', 'Cuando termines todas las estaciones y antes de tu examen real.'],
    ['gloss', 'Glosario', 'Las palabras técnicas del capítulo explicadas fácil, con ejemplo y página del libro.', 'Cuando no entiendas una palabra, o para repasar vocabulario.'],

    const guide = !S.guideSeen ? `<section class="card guide">

    return `
    <header class="hero">
      <p class="eyebrow on-acc">Derecho penal · Capítulo 2 · Breve historia</p>
      <h1>${hi}, Carmen</h1>
      <p class="sub">Vamos a entender la historia del derecho penal mexicano: de los códices prehispánicos al sistema acusatorio de 2008.</p>
      <div class="hero-meter"><div class="spread"><span>${doneN} de ${STUDY.length} estaciones</span><b class="tnum">${pct}%</b></div><div class="bar"><i style="width:${pct}%"></i></div></div>
    </header>
    ${guide}
    ${due.length ? `<section class="card due"><p class="eyebrow">Toca repasar hoy</p><h2>Repaso corto para que no se olvide</h2><p class="muted">5 preguntas por estación, menos de 5 minutos.</p><div class="stack">${due.map(id => `<button class="mission-l" data-a="review" data-id="${id}"><span class="mi">${LMAP[id].icon}</span><span class="t">${LMAP[id].title}</span><span class="chip">Repaso ${(S.reviews[id] || 0) + 1} de 3</span></button>`).join('')}</div></section>` : ''}

        : `<h2>¡Terminaste las ${LESSONS.length} estaciones!</h2><p>Ahora haz el <b>Examen A</b> y luego repasa lo que falles.</p><button class="btn wide" data-a="go" data-v="exam">Ir a Examen</button>`}

  /* ═════ APRENDER ═════ */
  function vLearn() {
    return `<header class="stack"><p class="eyebrow">Aprender</p><h1>Las estaciones del capítulo</h1>
    <p class="muted">Hazlas en orden, una por día (o dos si te sientes bien). Ten tu libro a la mano.</p></header>
    <section class="card howto"><p class="eyebrow">Cada estación tiene 5 pasos</p>
    <div class="phase-legend">${PHASES.slice(1).map((p, i) => `<span><b>${i + 1}. ${p[1]}</b>${['lees en el libro solo el párrafo que te indico', 'te lo explico con ejemplos', 'lo usas en casos de la vida real', '3 preguntas con explicación', 'lo dices con tus palabras'][i]}</span>`).join('')}</div></section>
    <div class="route">${LESSONS.map(l => {
      const done = !!S.done[l.id]; const m = mastery(l.id); const ph = S.phase[l.id];

      ${R.map((r, i) => `<article class="card frag${done[i] ? ' fdone' : ''}"><div class="spread"><p class="eyebrow">Fragmento ${i + 1} de ${R.length} · pág. ${r.pg} · ${r.mins} min</p>${done[i] ? '<span class="chip done">Leído</span>' : ''}</div>
        <div class="fr-where"><p><span class="lab">Empieza en</span> «${r.start.replace(/…$/, '')}…»</p><p><span class="lab">Termina en</span> «…${r.end.replace(/^…/, '')}»</p></div>

      ${UI.showModel ? `<div class="model"><p class="eyebrow">Respuesta modelo</p><p>${ex.model}</p></div>

  function qBlock(q, ans, ctx, num) {
    const answered = ans !== undefined;
    return `<div class="card q"><p class="q-text">${num ? `<span class="qn">${num}</span>` : ''}${q.f ? `<span class="chip fmt">${q.f}</span> ` : ''}${q.q}</p><div class="opts">${q.o.map((o, i) => {
      let cls = ''; if (answered) { if (i === q.a) cls = ' ok'; else if (i === ans) cls = ' no'; }
      return `<button class="opt${cls}" data-a="ans" data-ctx="${ctx}" data-q="${q.id}" data-i="${i}" ${answered ? 'disabled' : ''}><span class="ov">${LET[i]}</span><span>${o}</span></button>`;
    }).join('')}</div>${answered ? `<div class="fb ${ans === q.a ? 'ok' : 'no'}"><b class="h">${ans === q.a ? '¡Bien! Lo entendiste.' : 'Todavía no. Mira por qué:'}</b><p>${ans === q.a ? '' : `La respuesta es <b>${LET[q.a]}) ${q.o[q.a]}</b>. `}${q.e}</p><p class="pg">Libro, pág. ${q.p}</p></div>` : ''}</div>`;
  }

  /* ═════ HOJA DE REPASO INTERACTIVA ═════ */
  function vSheet() {
    const t = TIMELINE[UI.tlSel];

    return `${back('learn', 'Estaciones')}<header class="stack"><p class="eyebrow">Hoja de repaso interactiva</p><h1>Todo el capítulo en una página</h1><p class="muted">Primero intenta recordar; después toca para comprobar. Así la memoria trabaja de verdad.</p></header>
    <section class="card stack"><h2>1. Línea del tiempo</h2><p class="muted small">Toca cada fecha para ver qué pasó.</p>
      <div class="tl-wrap"><div class="tl">${TIMELINE.map((x, i) => `<button class="tl-i${i === UI.tlSel ? ' on' : ''}" data-a="tl" data-i="${i}"><span class="tl-y">${x.y}</span><span class="tl-d"></span><span class="tl-t">${x.t}</span></button>`).join('')}</div></div>
      <div class="tl-card"><p class="eyebrow">${t.y} · pág. ${t.p}</p><h3>${t.t}</h3><p>${t.d}</p><div class="row"><button class="btn small line" data-a="tlmove" data-d="-1" ${UI.tlSel === 0 ? 'disabled' : ''}>← Antes</button><button class="btn small line" data-a="tlmove" data-d="1" ${UI.tlSel === TIMELINE.length - 1 ? 'disabled' : ''}>Después →</button><button class="btn small ghost" data-a="open" data-id="${t.id}">Ir a la estación</button></div></div>
    </section>
    <section class="card stack"><div class="spread"><h2>2. Los tres códigos: tapa y destapa</h2><button class="icon-btn" data-a="hideall">${UI.hideAll ? 'Mostrar todo' : 'Tapar todo'}</button></div>
      <p class="muted small">Di la respuesta en voz alta antes de tocar la casilla.</p>
      <div class="tbl-wrap"><table class="tbl rvt"><thead><tr><th></th>${COMPARE.cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${COMPARE.rows.map((r, ri) => `<tr><th scope="row">${r[0]}</th>${r.slice(1).map((c, ci) => `<td>${cell('c' + ri + '-' + ci, c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    </section>
    <section class="card stack"><h2>3. Las tres épocas</h2>
      ${[['Prehispánica', 'Códices (pinturas)', 'Venganza privada en ciertos casos; pena según clase social', '7–8'], ['Colonial', 'Novísima Recopilación y Siete Partidas', 'Leyes según la raza; proceso secreto e inquisitivo', '9'], ['Independiente', 'Normas coloniales y bandos → códigos propios', 'De Veracruz (1835) al CPF (1999)', '10–14']].map((e, i) => `<div class="era"><b>${e[0]} <small class="muted">pág. ${e[3]}</small></b><div class="era-g"><span class="lab">¿Dónde estaban las normas?</span>${cell('e' + i + 'a', e[1])}<span class="lab">Rasgo clave</span>${cell('e' + i + 'b', e[2])}</div></div>`).join('')}
    </section>
    <section class="card stack"><h2>4. Reforma de 2008 en 5 datos</h2>
      ${[['¿Cuándo?', '18 de junio de 2008'], ['¿Por qué?', 'Criminalidad, inseguridad, impunidad, condena de inocentes y desamparo de víctimas'], ['¿Qué tipo de cambios?', 'Normativos, estructurales e ideológicos'], ['¿Qué código procesal?', 'CNPP, 5 de marzo de 2014: proceso acusatorio'], ['¿Fecha límite?', '17 de junio de 2016']].map((x, i) => `<div class="era-g one"><span class="lab">${x[0]}</span>${cell('r' + i, x[1])}</div>`).join('')}

  }

  /* ═════ PRACTICAR ═════ */
  function vPractice() {
    const wrongN = Object.keys(S.wrong).filter(k => S.wrong[k] > 0 && QMAP[k]).length;
    return `<header class="stack"><p class="eyebrow">Practicar</p><h1>Juegos para no olvidar</h1><p class="muted">Úsalos después de terminar una estación. Cada juego trabaja la memoria de una forma distinta.</p></header>
    <section class="card stack"><h2>Quiz con explicación</h2><p class="muted">10 preguntas. Después de cada una te digo por qué y en qué página está.</p>
      <label class="eyebrow" for="qsel">Tema</label><select id="qsel" class="search"><option value="mix">Todo el capítulo (mixto)</option>${LESSONS.map(l => `<option value="${l.id}">${l.title}</option>`).join('')}</select>
      <div class="row"><button class="btn" data-a="startquiz">Empezar quiz</button>${wrongN ? `<button class="btn ghost" data-a="startwrong">Repasar mis errores (${wrongN})</button>` : ''}</div></section>
    <section class="tiles">
      <button class="tile" data-a="go" data-v="flash"><span class="ti">🃏</span><b>Tarjetas</b><span>Para <b>recordar</b>: di la respuesta y voltea.</span></button>
      <button class="tile" data-a="go" data-v="riddle"><span class="ti">🕵️</span><b>Adivina quién soy</b><span>Para <b>relacionar</b>: 3 pistas, adivina con la menor cantidad.</span></button>
      <button class="tile" data-a="go" data-v="tf"><span class="ti">✅</span><b>Verdadero o falso</b><span>Para detectar <b>trampas</b> de examen.</span></button>
      <button class="tile" data-a="go" data-v="order"><span class="ti">🕰️</span><b>Ordena la historia</b><span>Para la <b>secuencia</b> de fechas.</span></button>
      <button class="tile" data-a="go" data-v="match"><span class="ti">🔗</span><b>Relaciona</b><span>Para <b>conectar</b> conceptos.</span></button>
      <button class="tile" data-a="go" data-v="cw"><span class="ti">✏️</span><b>Crucigrama</b><span>Para el <b>vocabulario</b>: 14 palabras.</span></button>
      <button class="tile" data-a="gquizstart"><span class="ti">📖</span><b>Reto del glosario</b><span>Lee la definición y elige la palabra.</span></button>
      <button class="tile" data-a="go" data-v="sheet"><span class="ti">🗂️</span><b>Hoja de repaso</b><span>Tapa y destapa todo el capítulo.</span></button>
    </section>`;
  }

  function startQuiz(pool, title, n, reviewOf) { UI.quiz = { qs: shuffle(pool).slice(0, n || 10), i: 0, ans: {}, title, reviewOf: reviewOf || null }; UI.view = 'quiz'; }
  function vQuiz() {
    const Z = UI.quiz; const total = Z.qs.length;
    if (Z.i >= total) {
      const ok = Z.qs.filter(q => Z.ans[q.id] === q.a).length; const pct = Math.round(ok / total * 100);
      const msg = pct >= 80 ? '¡Excelente! Lo tienes muy claro.' : pct >= 60 ? '¡Vas bien! Revisa las que fallaste.' : 'Buen intento. Con un repaso de la estación esto sube rápido.';
      const bad = Z.qs.filter(q => Z.ans[q.id] !== q.a);
      return `<header class="stack"><p class="eyebrow">${Z.title}</p><h1>Resultado</h1></header>
      <section class="card grade"><b class="tnum">${ok}/${total}</b><span>${msg}</span></section>
      ${bad.length ? `<section class="card stack"><h2>Para repasar</h2>${bad.map(q => `<div class="review-item"><p><b>${q.q}</b></p><p class="ok">✓ ${q.o[q.a]}</p><p class="muted">${q.e} · pág. ${q.p}</p></div>`).join('')}</section>` : ''}
      <div class="nav-btns"><button class="btn line" data-a="go" data-v="${Z.reviewOf ? 'home' : 'practice'}">Salir</button><button class="btn" data-a="go" data-v="practice">Otro juego</button></div>`;
    }
    const q = Z.qs[Z.i]; const ans = Z.ans[q.id];
    return `<div class="spread">${back(Z.reviewOf ? 'home' : 'practice', 'Salir')}<span class="muted tnum">${Z.i + 1} / ${total}</span></div>
    <div class="bar"><i style="width:${Z.i / total * 100}%"></i></div><p class="eyebrow">${Z.title} · ${LMAP[q.t].title}</p>
    ${qBlock(q, ans, 'quiz')}${ans !== undefined ? `<button class="btn wide" data-a="qnext">${Z.i === total - 1 ? 'Ver resultado' : 'Siguiente pregunta'}</button>` : ''}`;
  }

  function vTF() {
    if (!UI.tf) UI.tf = { list: shuffle(TF).slice(0, 10), i: 0, ok: 0, last: null };
    const Z = UI.tf;
    if (Z.i >= Z.list.length) return `${back('practice', 'Practicar')}<section class="card grade"><b class="tnum">${Z.ok}/${Z.list.length}</b><span>${Z.ok >= 8 ? '¡Muy bien!' : 'Cada error es una pista de qué repasar.'}</span></section><button class="btn wide" data-a="tfagain">Jugar otra vez</button>`;
    const it = Z.list[Z.i];
    return `<div class="spread">${back('practice', 'Practicar')}<span class="muted tnum">${Z.i + 1} / ${Z.list.length}</span></div><p class="eyebrow">Verdadero o falso · ${LMAP[it[3]].title}</p>
    <section class="card tf-card">${it[0]}</section>
    ${Z.last === null ? `<div class="tf-btns"><button class="btn" data-a="tf" data-v="1">Verdadero</button><button class="btn ghost" data-a="tf" data-v="0">Falso</button></div>` : `<div class="fb ${Z.last ? 'ok' : 'no'}"><b class="h">${Z.last ? '¡Correcto!' : 'No exactamente.'}</b><p>Es <b>${it[1] ? 'verdadero' : 'falso'}</b>. ${it[2]}</p></div><button class="btn wide" data-a="tfnext">Siguiente</button>`}`;
  }

  function vOrder() {
    if (!UI.order) { const g = ORDER_GAMES[0]; UI.order = { g, cur: shuffle(g.items), checked: false }; }
    const Z = UI.order; const ok = Z.cur.every((x, i) => x === Z.g.items[i]);
    return `${back('practice', 'Practicar')}<header class="stack"><p class="eyebrow">Ordena la historia</p><h1>${Z.g.title}</h1><p class="muted">Usa las flechas: lo primero arriba, lo último abajo.</p></header>
    <div class="row">${ORDER_GAMES.map(g => `<button class="icon-btn${g.id === Z.g.id ? ' on' : ''}" data-a="ordsel" data-id="${g.id}">${g.title}</button>`).join('')}</div>
    <div class="order-list">${Z.cur.map((it, i) => `<div class="order-item${Z.checked ? (it === Z.g.items[i] ? ' good' : ' badp') : ''}"><span class="on">${i + 1}</span><span>${it}</span><span class="mv"><button data-a="mv" data-i="${i}" data-d="-1" aria-label="Subir" ${i === 0 ? 'disabled' : ''}>↑</button><button data-a="mv" data-i="${i}" data-d="1" aria-label="Bajar" ${i === Z.cur.length - 1 ? 'disabled' : ''}>↓</button></span></div>`).join('')}</div>
    ${Z.checked ? `<div class="fb ${ok ? 'ok' : 'no'}"><b class="h">${ok ? '¡Orden perfecto!' : 'Los marcados en rojo están fuera de lugar. Muévelos y vuelve a revisar.'}</b></div>` : ''}
    <div class="nav-btns"><button class="btn line" data-a="ordshuffle">Revolver</button><button class="btn" data-a="ordcheck">Revisar orden</button></div>`;
  }

  function setMatch(g) { UI.match = { g, left: shuffle(g.pairs.map(p => p[0])), right: shuffle(g.pairs.map(p => p[1])), sel: null, done: [], miss: 0, err: null, errR: null }; }
  function vMatch() {
    if (!UI.match) setMatch(MATCH_GAMES[0]);
    const Z = UI.match; const doneAll = Z.done.length === Z.g.pairs.length;
    return `${back('practice', 'Practicar')}<header class="stack"><p class="eyebrow">Relaciona</p><h1>${Z.g.title}</h1><p class="muted">Toca un elemento de la izquierda y luego su pareja de la derecha.</p></header>
    <div class="row">${MATCH_GAMES.map(g => `<button class="icon-btn${g.id === Z.g.id ? ' on' : ''}" data-a="matsel" data-id="${g.id}">${g.title}</button>`).join('')}</div>
    <div class="match-grid"><div class="stack">${Z.left.map(x => `<button class="${Z.done.includes(x) ? 'done' : Z.sel === x ? 'sel' : ''}${Z.err === x ? ' err' : ''}" data-a="mL" data-v="${esc(x)}" ${Z.done.includes(x) ? 'disabled' : ''}>${x}</button>`).join('')}</div>
    <div class="stack">${Z.right.map(x => { const k = Z.g.pairs.find(p => p[1] === x)[0]; return `<button class="${Z.done.includes(k) ? 'done' : ''}${Z.errR === x ? ' err' : ''}" data-a="mR" data-v="${esc(x)}" ${Z.done.includes(k) ? 'disabled' : ''}>${x}</button>`; }).join('')}</div></div>
    ${doneAll ? `<div class="fb ok"><b class="h">¡Completo!${Z.miss ? ` Con ${Z.miss} intento${Z.miss > 1 ? 's' : ''} fallido${Z.miss > 1 ? 's' : ''}.` : ' Sin errores.'}</b></div>` : ''}`;
  }

  function vFlash() {
    const pool = FLASH.map((f, i) => ({ f, i })).filter(x => UI.flashT === 'all' || x.f[0] === UI.flashT);
    if (!UI.flash || UI.flash.key !== UI.flashT) { const order = shuffle(pool).sort((a, b) => (S.flash[a.i] === 'ok') - (S.flash[b.i] === 'ok')); UI.flash = { key: UI.flashT, list: order.map(x => x.i), i: 0, flip: false }; }
    const Z = UI.flash; const known = pool.filter(x => S.flash[x.i] === 'ok').length;
    if (Z.i >= Z.list.length) return `${back('practice', 'Practicar')}<section class="card grade"><b class="tnum">${known}/${pool.length}</b><span>tarjetas que ya te sabes</span></section><button class="btn wide" data-a="flashagain">Repasar otra vez</button>`;
    const f = FLASH[Z.list[Z.i]];
    return `<div class="spread">${back('practice', 'Practicar')}<span class="muted tnum">${Z.i + 1} / ${Z.list.length}</span></div>
    <label class="eyebrow" for="fsel">Tema</label><select id="fsel" class="search"><option value="all">Todas</option>${LESSONS.map(l => `<option value="${l.id}" ${UI.flashT === l.id ? 'selected' : ''}>${l.title}</option>`).join('')}</select>
    <button class="flip${Z.flip ? ' on' : ''}" data-a="flip" aria-label="Voltear tarjeta"><div class="flip-in"><div class="face front"><div><small>${LMAP[f[0]].title}</small>${f[1]}<small class="hint-s">Toca para voltear</small></div></div><div class="face back"><div>${f[2]}</div></div></div></button>
    ${Z.flip ? `<div class="tf-btns"><button class="btn ghost" data-a="fl" data-v="rep">Otra vez</button><button class="btn" data-a="fl" data-v="ok">Ya me la sé</button></div>` : `<p class="muted center">Primero intenta decir la respuesta en voz alta. Luego voltea.</p>`}`;
  }

  function vRiddle() {
    if (!UI.riddle) UI.riddle = { list: shuffle(RIDDLES), i: 0, clue: 1, ans: null, pts: 0 };
    const Z = UI.riddle;
    if (Z.i >= Z.list.length) return `${back('practice', 'Practicar')}<section class="card grade"><b class="tnum">${Z.pts}</b><span>puntos de ${Z.list.length * 3} posibles</span></section><button class="btn wide" data-a="ridagain">Jugar otra vez</button>`;
    const r = Z.list[Z.i];
    return `<div class="spread">${back('practice', 'Practicar')}<span class="muted tnum">${Z.i + 1} / ${Z.list.length} · ${Z.pts} pts</span></div>
    <header class="stack"><p class="eyebrow">Adivina quién soy</p><p class="muted small">Si aciertas con 1 pista ganas 3 puntos; con 2, 2 puntos; con 3, 1 punto.</p></header>
    <section class="card stack">${r.clues.slice(0, Z.ans !== null ? 3 : Z.clue).map((c, i) => `<p class="clue-r"><span class="flow-n">${i + 1}</span>${c}</p>`).join('')}
    ${Z.ans === null && Z.clue < 3 ? `<button class="btn line small" data-a="ridclue">Dame otra pista</button>` : ''}</section>
    <div class="opts">${r.o.map((o, i) => { let cls = ''; if (Z.ans !== null) { if (o === r.a) cls = ' ok'; else if (i === Z.ans) cls = ' no'; } return `<button class="opt${cls}" data-a="ridans" data-i="${i}" ${Z.ans !== null ? 'disabled' : ''}><span class="ov">${LET[i]}</span><span>${o}</span></button>`; }).join('')}</div>
    ${Z.ans !== null ? `<div class="fb ${r.o[Z.ans] === r.a ? 'ok' : 'no'}"><b class="h">${r.o[Z.ans] === r.a ? '¡Me adivinaste!' : 'Era: ' + r.a}</b></div><button class="btn wide" data-a="ridnext">Siguiente</button>` : ''}`;
  }

  /* Crucigrama */
  const CELLS = (() => { const cells = {}; CW.words.forEach((w, wi) => { for (let k = 0; k < w.w.length; k++) { const key = (w.r + (w.d === 'D' ? k : 0)) + '-' + (w.col + (w.d === 'A' ? k : 0)); cells[key] = cells[key] || { ch: w.w[k], words: [] }; cells[key].words.push(wi); } }); return cells; })();
  const NUMS = (() => { const starts = {}; let n = 0; CW.words.map((w, i) => ({ i, r: w.r, c: w.col })).sort((a, b) => a.r - b.r || a.c - b.c).forEach(k => { const key = k.r + '-' + k.c; if (!starts[key]) starts[key] = ++n; CW.words[k.i].num = starts[key]; }); return starts; })();
  const wkey = (w, k) => (w.r + (w.d === 'D' ? k : 0)) + '-' + (w.col + (w.d === 'A' ? k : 0));
  const solvedW = w => w.w.split('').every((ch, k) => S.cw[wkey(w, k)] === ch);
  function vCW() {
    const sel = UI.cwSel; const w = sel !== null ? CW.words[sel] : null;
    const inW = key => w && w.w.split('').some((_, k) => wkey(w, k) === key);
    let grid = '';
    for (let r = 0; r < CW.H; r++) for (let c = 0; c < CW.W; c++) {
      const key = r + '-' + c; const cell = CELLS[key];
      if (!cell) { grid += '<span class="cw-x"></span>'; continue; }
      const v = S.cw[key] || ''; let st = ''; if (UI.cwChecked && v) st = v === cell.ch ? ' good' : ' bad';
      grid += `<label class="cw-c${inW(key) ? ' hl' : ''}${st}">${NUMS[key] ? `<i>${NUMS[key]}</i>` : ''}<input id="cw-${key}" data-a="cwin" data-k="${key}" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${v}" aria-label="Casilla"></label>`;
    }
    const list = d => CW.words.map((x, i) => ({ x, i })).filter(o => o.x.d === d).sort((a, b) => a.x.num - b.x.num).map(o => `<button class="clue${sel === o.i ? ' on' : ''}${solvedW(o.x) ? ' solved' : ''}" data-a="cwclue" data-i="${o.i}"><b>${o.x.num}</b><span>${o.x.c} <small>(${o.x.w.length})</small></span></button>`).join('');
    const solvedN = CW.words.filter(solvedW).length;
    return `${back('practice', 'Practicar')}<header class="stack"><p class="eyebrow">Crucigrama · Capítulo 2</p><h1>Palabras clave de la historia penal</h1><p class="muted">Sin acentos ni espacios. Toca una pista para marcar su lugar. Llevas <b>${solvedN} de ${CW.words.length}</b>.</p></header>
    ${w ? `<div class="card cw-now"><b>${w.num} ${w.d === 'A' ? 'horizontal' : 'vertical'}:</b> ${w.c}</div>` : ''}
    <div class="cw-wrap"><div class="cw" style="grid-template-columns:repeat(${CW.W}, var(--cw))">${grid}</div></div>
    <div class="row"><button class="btn" data-a="cwcheck">Revisar</button>${w ? `<button class="btn ghost" data-a="cwhint">Darme una letra</button>` : ''}<button class="btn line" data-a="cwclear">Borrar todo</button></div>
    <section class="card stack"><h2>Horizontales</h2><div class="clues">${list('A')}</div><h2>Verticales</h2><div class="clues">${list('D')}</div></section>`;
  }

  /* ═════ EXAMEN ═════ */
  function grade10(c, n) { return Math.round(c / n * 100) / 10; }
  function vExam() {
    return `<header class="stack"><p class="eyebrow">Examen</p><h1>Exámenes de todo el capítulo</h1><p class="muted">Como en la universidad: no ves si acertaste hasta el final. Al terminar te doy tu calificación del 0 al 10 y te explico cada error.</p></header>
    <section class="card tips"><h2>Antes de empezar</h2><ul class="tight-list"><li>Hazlo cuando ya hayas terminado todas las estaciones (o casi todas).</li><li>Busca un lugar tranquilo. Calcula 30 a 40 minutos.</li><li>Lee <b>todas</b> las opciones. Fíjate en años, «primero», «nunca», «siempre».</li><li>Si dudas entre dos, descarta la que contradice algo que sabes seguro.</li></ul></section>
    <div class="stack">${EXAMS.map(x => { const h = S.exams[x.id] || []; const best = h.length ? Math.max(...h.map(r => r.g)) : null; return `<div class="card exrow"><div class="stack tight"><b class="exn">${x.title}</b><span class="muted small">${x.desc}</span>${h.length ? `<span class="small">Mejor: <b class="tnum">${best}</b> · intentos: ${h.length} · último: <b class="tnum">${h[h.length - 1].g}</b></span>` : ''}</div><button class="btn small" data-a="exstart" data-id="${x.id}">${h.length ? 'Repetir' : 'Empezar'}</button></div>`; }).join('')}</div>`;
  }
  function vExamRun() {
    const Z = UI.exam; const total = Z.qs.length;
    if (Z.finished) {
      const ok = Z.qs.filter(q => Z.ans[q.id] === q.a).length; const g = grade10(ok, total);
      const by = {}; Z.qs.forEach(q => { by[q.t] = by[q.t] || [0, 0]; by[q.t][1]++; if (Z.ans[q.id] === q.a) by[q.t][0]++; });
      const bad = Z.qs.filter(q => Z.ans[q.id] !== q.a);
      return `<header class="stack"><p class="eyebrow">${Z.title} · resultado</p><h1>Tu calificación</h1></header>
      <section class="card grade"><b class="tnum">${g}</b><span>${ok} de ${total} correctas · ${g >= 8 ? '¡Excelente trabajo!' : g >= 6 ? 'Aprobado. Repasa las estaciones marcadas.' : 'Todavía no, y está bien: ahora sabes exactamente qué repasar.'}</span></section>
      <section class="card stack"><h2>Por estación</h2>${Object.keys(by).map(t => { const [c, n] = by[t]; const pc = Math.round(c / n * 100); return `<div class="unitbar"><div class="spread"><span><b>${LMAP[t].title}</b></span><span class="muted tnum">${c}/${n}</span></div><div class="bar ${pc >= 80 ? 'ok' : ''}"><i style="width:${pc}%"></i></div>${pc < 60 ? `<button class="linkbtn" data-a="open" data-id="${t}">Repasar esta estación →</button>` : ''}</div>`; }).join('')}</section>

    }

    <div class="qnav">${Z.qs.map((x, i) => `<button class="${Z.ans[x.id] !== undefined ? 'ans' : ''}${i === Z.i ? ' cur' : ''}" data-a="exgo" data-i="${i}" aria-label="Pregunta ${i + 1}">${i + 1}</button>`).join('')}</div>
    <div class="card q"><p class="eyebrow">${Z.title} · pregunta ${Z.i + 1} de ${total}</p><p class="q-text">${q.f ? `<span class="chip fmt">${q.f}</span> ` : ''}${q.q}</p><div class="opts">${q.o.map((o, i) => `<button class="opt${ans === i ? ' picked' : ''}" data-a="exans" data-i="${i}"><span class="ov">${LET[i]}</span><span>${o}</span></button>`).join('')}</div></div>

  /* ═════ GLOSARIO ═════ */
  function vGloss() {
    const q = norm(UI.gq || '');

    return `<header class="stack"><p class="eyebrow">Glosario</p><h1>Vocabulario técnico</h1><p class="muted">${GLOSSARY.length} palabras del capítulo explicadas fácil, con ejemplo y página del libro.</p></header>
    <div class="stack"><label class="sr" for="gq">Buscar palabra</label><input id="gq" class="search" type="search" placeholder="Buscar: casuismo, dolo, códice…" value="${esc(UI.gq)}" data-a="gsearch">

  }
  function startGQuiz() { const items = shuffle(GLOSSARY).slice(0, 10); UI.gquiz = { items: items.map(g => ({ g, o: shuffle([g[0]].concat(shuffle(GLOSSARY.filter(x => x[0] !== g[0])).slice(0, 3).map(x => x[0]))) })), i: 0, ans: null, ok: 0 }; UI.view = 'gquiz'; }
  function vGQuiz() {
    const Z = UI.gquiz;
    if (Z.i >= Z.items.length) return `${back('gloss', 'Glosario')}<section class="card grade"><b class="tnum">${Z.ok}/${Z.items.length}</b><span>palabras reconocidas</span></section><button class="btn wide" data-a="gquizstart">Otra ronda</button>`;
    const it = Z.items[Z.i];
    return `<div class="spread">${back('gloss', 'Glosario')}<span class="muted tnum">${Z.i + 1} / ${Z.items.length}</span></div><p class="eyebrow">¿Qué palabra es?</p>
    <section class="card tf-card">${it.g[1]}</section>
    <div class="opts">${it.o.map((o, i) => { let cls = ''; if (Z.ans !== null) { if (o === it.g[0]) cls = ' ok'; else if (i === Z.ans) cls = ' no'; } return `<button class="opt${cls}" data-a="gans" data-i="${i}" ${Z.ans !== null ? 'disabled' : ''}><span class="ov">${LET[i]}</span><span>${o}</span></button>`; }).join('')}</div>
    ${Z.ans !== null ? `${it.g[4] ? `<p class="muted"><b>Ejemplo:</b> ${it.g[4]}</p>` : ''}<button class="btn wide" data-a="gnext">Siguiente</button>` : ''}`;
  }

  /* ═════ VIDEOS ═════ */
  const ytUrl = x => 'https://www.youtube.com/watch?v=' + x.id + (x.start ? '&t=' + x.start + 's' : '');
  const mmss = n => Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
  function videoRow(g) {
    const l = LMAP[g.t];
    return `<div class="stack"><div><p class="eyebrow">${l.era}</p><b class="vt">${l.title}</b></div>${g.v.map(x => `<div class="vid"><div class="vid-play" aria-hidden="true">▶</div><div class="stack tight"><b>${x.title}</b><span class="muted small">${x.ch} · ${x.dur}${x.start ? ` · empieza en el minuto <b>${mmss(x.start)}</b>` : ''}</span></div>

  function vVideos() {
    return `<header class="stack"><p class="eyebrow">Videos y lecturas</p><h1>Para ver y escuchar el tema</h1><p class="muted">Videos elegidos para cada estación. Revisé lo que dicen y te indico qué parte ver y en qué se diferencian del libro. Úsalos <b>después</b> de la estación, como refuerzo.</p></header>

    <section class="card trust stack"><h2>Para aprovecharlos</h2><ul class="tight-list"><li>Si un video dice algo distinto al libro, <b>para tu examen gana el libro</b>. Anota la duda para tu maestra.</li><li>Mientras ves, pausa y pregúntate: ¿esto en qué estación lo vi?</li><li>Si buscas otros videos, prefiere canales de universidades o profesores que digan sus fuentes, y que hablen de <b>México</b>.</li></ul></section>

  /* ═════ MI AVANCE ═════ */
  function vProgress() {
    const st = streak(); const pct = S.answered ? Math.round(S.correct / S.answered * 100) : 0;

    <section class="card evidence"><p class="eyebrow">Evidencia, no opiniones</p><p>${S.correct ? `Has respondido bien <b>${S.correct}</b> preguntas de derecho penal (${pct}% de aciertos). Cada una es algo que entendiste.` : 'Cuando respondas preguntas, aquí verás cuántas entendiste. Los números no mienten.'}</p></section>
    <section class="card stack"><h2>Por estación</h2>${LESSONS.map(l => { const m = mastery(l.id); const r = S.reviews[l.id] || 0; return `<div class="unitbar"><div class="spread"><span><b>${l.title}</b>${S.done[l.id] ? ` <span class="chip done">Terminada · repasos ${r}/3</span>` : ''}</span><span class="muted tnum">${m === null ? 'sin datos' : Math.round(m * 100) + '%'}</span></div><div class="bar ${m !== null && m >= .8 ? 'ok' : ''}"><i style="width:${m === null ? 0 : Math.round(m * 100)}%"></i></div></div>`; }).join('')}</section>
    <section class="card stack"><h2>Exámenes</h2>${EXAMS.map(x => { const h = S.exams[x.id] || []; return `<p>${x.title}: ${h.length ? h.map(r => `<b class="tnum">${r.g}</b>`).join(' → ') : '<span class="muted">sin intentos</span>'}</p>`; }).join('')}</section>
    <section class="card stack"><h2>Voz para escuchar</h2><label class="eyebrow" for="rate">Velocidad de lectura</label><select id="rate" class="search"><option value="0.8" ${S.rate == 0.8 ? 'selected' : ''}>Lenta</option><option value="0.95" ${S.rate == 0.95 ? 'selected' : ''}>Normal</option><option value="1.1" ${S.rate == 1.1 ? 'selected' : ''}>Rápida</option></select></section>

    <section class="card stack"><h2>Empezar de cero</h2><p class="muted small">Tu avance se guarda solo en este teléfono o computadora.</p>${UI.confirmReset ? `<div class="row"><button class="btn" data-a="reset2">Sí, borrar todo</button><button class="btn line" data-a="reset0">Cancelar</button></div>` : `<button class="btn line" data-a="reset">Borrar mi avance</button>`}</section>`;
  }

  /* ═════ RENDER ═════ */
  function render(keepScroll) {
    stopSpeak();
    const views = { home: vHome, learn: vLearn, lesson: vLesson, sheet: vSheet, practice: vPractice, quiz: vQuiz, tf: vTF, order: vOrder, match: vMatch, flash: vFlash, riddle: vRiddle, cw: vCW, exam: vExam, examrun: vExamRun, gloss: vGloss, gquiz: vGQuiz, videos: vVideos, progress: vProgress };
    const y = window.scrollY;
    $('#app').innerHTML = `<main class="app">${(views[UI.view] || vHome)()}</main>${tabbar()}`;
    window.scrollTo(0, keepScroll ? y : 0);
  }
  function go(v) { UI.view = v; if (v === 'tf') UI.tf = null; if (v === 'order') UI.order = null; if (v === 'match') UI.match = null; if (v === 'flash') UI.flash = null; if (v === 'riddle') UI.riddle = null; UI.cwChecked = false; render(); }
  function setPhase(p) { UI.phase = p; S.phase[UI.lesson] = p; save(); }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a;
    if (['cwin', 'exptext', 'keychk', 'gsearch'].includes(a)) return;
    if (a === 'go') go(b.dataset.v);
    else if (a === 'guideok') { S.guideSeen = true; save(); render(true); }
    else if (a === 'guideon') { S.guideSeen = false; save(); toast('La guía aparecerá en Inicio.'); }
    else if (a === 'speak') speak(b.dataset.speak, SPK[b.dataset.speak]);
    else if (a === 'open') { const id = b.dataset.id; UI.lesson = id; UI.step = Math.min(S.step[id] || 0, LMAP[id].steps.length - 1); UI.phase = S.phase[id] || 'intro'; UI.checks = {}; UI.caseOpen = {}; UI.readOpen = {}; UI.showModel = false; UI.view = 'lesson'; render(); }
    else if (a === 'setphase' || a === 'phase') { setPhase(b.dataset.v); render(); }
    else if (a === 'readans') { const i = +b.dataset.i; UI.readOpen[i] = true; S.read[UI.lesson] = S.read[UI.lesson] || {}; S.read[UI.lesson][i] = true; mark(); save(); render(true); }
    else if (a === 'caseopen') { UI.caseOpen[+b.dataset.i] = true; render(true); }
    else if (a === 'next') { const l = LMAP[UI.lesson]; if (UI.step < l.steps.length - 1) { UI.step++; S.step[l.id] = UI.step; save(); } else setPhase('cases'); render(); }
    else if (a === 'prev') { if (UI.step === 0) setPhase('read'); else UI.step--; render(); }
    else if (a === 'showmodel') { UI.showModel = true; render(true); }
    else if (a === 'finish') { const id = UI.lesson; const first = !S.done[id]; if (first) { S.done[id] = today(); S.reviews[id] = 0; } mark(); save(); UI.view = 'learn'; render(); toast(first ? 'Estación terminada. Mañana te toca un repaso corto en Inicio.' : 'Guardado.'); }
    else if (a === 'ans') {
      const q = QMAP[b.dataset.q]; const i = +b.dataset.i; const ok = i === q.a;
      record(q.t, ok); S.wrong[q.id] = ok ? Math.max(0, (S.wrong[q.id] || 0) - 1) : (S.wrong[q.id] || 0) + 1; save();
      if (b.dataset.ctx === 'chk') UI.checks[q.id] = i; else UI.quiz.ans[q.id] = i; render(true);
    }
    else if (a === 'qnext') { UI.quiz.i++; if (UI.quiz.i >= UI.quiz.qs.length && UI.quiz.reviewOf) { const id = UI.quiz.reviewOf; S.reviews[id] = (S.reviews[id] || 0) + 1; save(); } render(); }
    else if (a === 'startquiz') { const t = $('#qsel').value; startQuiz(t === 'mix' ? BANK : BANK.filter(q => q.t === t), t === 'mix' ? 'Quiz mixto' : 'Quiz: ' + LMAP[t].title); render(); }
    else if (a === 'startwrong') { const pool = BANK.filter(q => S.wrong[q.id] > 0); if (!pool.length) { toast('No tienes errores pendientes. ¡Bien!'); return; } startQuiz(pool, 'Mis errores'); render(); }
    else if (a === 'review') { const id = b.dataset.id; startQuiz(BANK.filter(q => q.t === id), 'Repaso: ' + LMAP[id].title, 5, id); render(); }
    else if (a === 'tf') { const it = UI.tf.list[UI.tf.i]; const ok = (b.dataset.v === '1') === it[1]; UI.tf.last = ok; if (ok) UI.tf.ok++; record(it[3], ok); save(); render(true); }
    else if (a === 'tfnext') { UI.tf.i++; UI.tf.last = null; render(); }
    else if (a === 'tfagain') { UI.tf = null; render(); }
    else if (a === 'ordsel') { const g = ORDER_GAMES.find(x => x.id === b.dataset.id); UI.order = { g, cur: shuffle(g.items), checked: false }; render(true); }
    else if (a === 'mv') { const Z = UI.order; const i = +b.dataset.i, j = i + (+b.dataset.d); [Z.cur[i], Z.cur[j]] = [Z.cur[j], Z.cur[i]]; Z.checked = false; render(true); }
    else if (a === 'ordshuffle') { UI.order.cur = shuffle(UI.order.g.items); UI.order.checked = false; render(true); }
    else if (a === 'ordcheck') { UI.order.checked = true; if (UI.order.cur.every((x, i) => x === UI.order.g.items[i])) { S.games[UI.order.g.id] = (S.games[UI.order.g.id] || 0) + 1; mark(); } render(true); }
    else if (a === 'matsel') { setMatch(MATCH_GAMES.find(x => x.id === b.dataset.id)); render(true); }
    else if (a === 'mL') { UI.match.sel = b.dataset.v; UI.match.err = UI.match.errR = null; render(true); }
    else if (a === 'mR') {
      const Z = UI.match; if (!Z.sel) { toast('Primero toca un elemento de la izquierda.'); return; }
      const pair = Z.g.pairs.find(p => p[0] === Z.sel);
      if (pair[1] === b.dataset.v) { Z.done.push(Z.sel); Z.sel = null; Z.err = Z.errR = null; if (Z.done.length === Z.g.pairs.length) mark(); } else { Z.miss++; Z.err = Z.sel; Z.errR = b.dataset.v; Z.sel = null; }
      render(true);
    }
    else if (a === 'flip') { UI.flash.flip = !UI.flash.flip; render(true); }
    else if (a === 'fl') { S.flash[UI.flash.list[UI.flash.i]] = b.dataset.v; mark(); UI.flash.i++; UI.flash.flip = false; render(true); }
    else if (a === 'flashagain') { UI.flash = null; render(); }
    else if (a === 'ridclue') { UI.riddle.clue++; render(true); }
    else if (a === 'ridans') { const Z = UI.riddle; Z.ans = +b.dataset.i; const r = Z.list[Z.i]; if (r.o[Z.ans] === r.a) Z.pts += 4 - Z.clue; mark(); render(true); }
    else if (a === 'ridnext') { const Z = UI.riddle; Z.i++; Z.clue = 1; Z.ans = null; render(); }
    else if (a === 'ridagain') { UI.riddle = null; render(); }
    else if (a === 'cwclue') { UI.cwSel = +b.dataset.i; const w = CW.words[UI.cwSel]; render(true); let k = w.w.split('').findIndex((ch, j) => !S.cw[wkey(w, j)]); if (k < 0) k = 0; const el = document.getElementById('cw-' + wkey(w, k)); if (el) { el.focus({ preventScroll: true }); el.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' }); } }
    else if (a === 'cwcheck') { UI.cwChecked = true; mark(); render(true); if (Object.keys(CELLS).every(k => S.cw[k] === CELLS[k].ch)) toast('¡Crucigrama completo!'); }
    else if (a === 'cwhint') { const w = CW.words[UI.cwSel]; for (let k = 0; k < w.w.length; k++) { const key = wkey(w, k); if (S.cw[key] !== w.w[k]) { S.cw[key] = w.w[k]; break; } } save(); render(true); }
    else if (a === 'cwclear') { S.cw = {}; UI.cwChecked = false; save(); render(true); }
    else if (a === 'exstart') { const x = EXAMS.find(z => z.id === b.dataset.id); let qs = x.ids().map(id => QMAP[id]).filter(Boolean); qs = x.random ? shuffle(qs).slice(0, x.n) : x.order ? qs.sort((p, q) => LMAP[p.t].n - LMAP[q.t].n) : shuffle(qs); qs = qs.map(q => q); UI.exam = { id: x.id, title: x.title, qs, i: 0, ans: {}, finished: false, confirm: false }; UI.view = 'examrun'; render(); }
    else if (a === 'exans') { UI.exam.ans[UI.exam.qs[UI.exam.i].id] = +b.dataset.i; render(true); }
    else if (a === 'exmove') { UI.exam.i += +b.dataset.d; UI.exam.confirm = false; render(); }
    else if (a === 'exgo') { UI.exam.i = +b.dataset.i; UI.exam.confirm = false; render(); }
    else if (a === 'exfinish' || a === 'exfinish2') {
      const Z = UI.exam; const missing = Z.qs.length - Object.keys(Z.ans).length;
      if (a === 'exfinish' && missing > 0) { Z.confirm = true; render(true); return; }
      Z.finished = true; let ok = 0; Z.qs.forEach(q => { const good = Z.ans[q.id] === q.a; if (good) ok++; record(q.t, good); S.wrong[q.id] = good ? Math.max(0, (S.wrong[q.id] || 0) - 1) : (S.wrong[q.id] || 0) + 1; });
      S.exams[Z.id] = (S.exams[Z.id] || []).concat([{ d: today(), g: grade10(ok, Z.qs.length) }]); save(); render();
    }
    else if (a === 'exnoconfirm') { UI.exam.confirm = false; render(true); }
    else if (a === 'exquit') { UI.view = 'exam'; UI.exam = null; render(); }
    else if (a === 'gquizstart') { startGQuiz(); render(); }
    else if (a === 'gans') { const Z = UI.gquiz; Z.ans = +b.dataset.i; const it = Z.items[Z.i]; if (it.o[Z.ans] === it.g[0]) Z.ok++; mark(); render(true); }
    else if (a === 'gnext') { UI.gquiz.i++; UI.gquiz.ans = null; render(); }
    else if (a === 'copyq') copyText(b.dataset.q);
    else if (a === 'tl') { UI.tlSel = +b.dataset.i; render(true); }
    else if (a === 'tlmove') { UI.tlSel += +b.dataset.d; render(true); }
    else if (a === 'rv') { UI.reveal[b.dataset.k] = !UI.reveal[b.dataset.k]; render(true); }
    else if (a === 'hideall') { UI.hideAll = !UI.hideAll; UI.reveal = {}; render(true); }
    else if (a === 'reset') { UI.confirmReset = true; render(true); }
    else if (a === 'reset0') { UI.confirmReset = false; render(true); }
    else if (a === 'reset2') { S = defaults(); save(); UI.confirmReset = false; toast('Avance borrado.'); go('home'); }
  });

  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.a === 'exptext') { S.explain[UI.lesson] = el.value; save(); }
    else if (el.dataset.a === 'gsearch') { UI.gq = el.value; const q = norm(el.value); const list = GLOSSARY.filter(g => (UI.gt === 'all' || g[2] === UI.gt) && (!q || norm(g[0] + ' ' + g[1]).includes(q))); $('#glist').innerHTML = glossList(list); }
    else if (el.dataset.a === 'cwin') {
      const key = el.dataset.k; const v = (el.value || '').toUpperCase().normalize('NFD').replace(/[^A-ZÑ]/g, '').slice(-1);
      el.value = v; S.cw[key] = v; save(); el.parentElement.classList.remove('good', 'bad');
      if (v) { const [r, c] = key.split('-').map(Number); const cell = CELLS[key]; const w = (UI.cwSel !== null && cell.words.includes(UI.cwSel)) ? CW.words[UI.cwSel] : CW.words[cell.words[0]]; const nk = w.d === 'A' ? r + '-' + (c + 1) : (r + 1) + '-' + c; const nx = document.getElementById('cw-' + nk); if (nx) nx.focus(); }
    }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.a === 'keychk') { const id = UI.lesson; S.keys[id] = S.keys[id] || {}; S.keys[id][el.dataset.i] = el.checked; save(); }
    else if (el.id === 'fsel') { UI.flashT = el.value; UI.flash = null; render(true); }
    else if (el.id === 'gt') { UI.gt = el.value; render(true); }
    else if (el.id === 'rate') { S.rate = +el.value; save(); toast('Velocidad guardada.'); }
  });
  document.addEventListener('focusin', e => {
    const el = e.target; if (!(el.dataset && el.dataset.a === 'cwin' && UI.view === 'cw')) return;
    const cell = CELLS[el.dataset.k]; if (UI.cwSel !== null && cell.words.includes(UI.cwSel)) return;
    UI.cwSel = cell.words[0]; const w = CW.words[UI.cwSel];
    document.querySelectorAll('.cw-c').forEach(x => x.classList.remove('hl'));
    for (let k = 0; k < w.w.length; k++) { const n = document.getElementById('cw-' + wkey(w, k)); if (n) n.parentElement.classList.add('hl'); }
    const html = `<b>${w.num} ${w.d === 'A' ? 'horizontal' : 'vertical'}:</b> ${w.c}`; const now = document.querySelector('.cw-now');
    if (now) now.innerHTML = html; else { const d = document.createElement('div'); d.className = 'card cw-now'; d.innerHTML = html; document.querySelector('.cw-wrap').before(d); }
  });

  render();
})();
